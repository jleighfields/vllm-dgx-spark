# model.conf — edit this file to switch models
# Sourced by start.sh, download-model.sh, use-local.sh, and cluster scripts.

# HuggingFace repo to download
MODEL_REPO="NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"

# Local subdirectory under models/
MODEL_DIR_NAME="Qwen3-Coder-30B-A3B-Instruct-FP4"

# Name vLLM advertises on /v1/models — must match litellm-config.yaml
SERVED_MODEL_NAME="NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"

# vLLM quantization format (compressed-tensors, modelopt_fp4, awq, fp8, etc.)
QUANTIZATION="modelopt_fp4"

# Model's max context window in tokens
# Default is 524288 (512K) via YaRN ×2 rope scaling (see EXTRA_VLLM_FLAGS).
# Model native is 262144 (256K). At 512K each in-flight max-context sequence
# consumes ~25 GB of KV cache (vs ~12 GB at 256K), tightening max concurrency
# from ~5× to ~3.49× — irrelevant for typical 1-2 concurrent sessions.
# To roll back to native 256K, see the "Rollback to native 256K" block below.
MAX_MODEL_LEN=524288

# Tool call parser (qwen3_xml, qwen3_coder, hermes, etc.)
TOOL_CALL_PARSER="qwen3_coder"

# Max tokens LiteLLM will return per response (caps individual replies, not context)
MAX_TOKENS=16384

# Optional extra vLLM CLI args appended to VLLM_EXTRA_ARGS — leave empty if not needed
# Default uses --hf-overrides to enable YaRN ×2 rope scaling and lift the model's
# max_position_embeddings from 262144 to 524288.
# Steady-state cost (measured 2026-05-02 on real Claude Code traffic):
#   - Gen throughput: ~28.5 t/s vs ~33 t/s at 256K native (~13% slower)
#   - TTFT, prefix caching, hit rate: unchanged
#   - Short-prompt quality: no formal A/B; YaRN factor=2.0 should be near-
#     identical to native RoPE in the interpolated range
# Roll back to native 256K if you have no real long-context workload (see the
# "Rollback to native 256K" block at the bottom of this file).
# Notes:
#   - vLLM v0.16 uses --hf-overrides; older docs may show --rope-scaling (not
#     recognized in this build).
#   - max_position_embeddings is overridden alongside rope_scaling because
#     vLLM's max_model_len validation runs before --hf-overrides merges;
#     VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 in EXTRA_DOCKER_ENVS is the bypass.
EXTRA_VLLM_FLAGS='--hf-overrides {"max_position_embeddings":524288,"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":262144}}'

# Optional extra Docker -e env vars passed to the container (space-separated KEY=VALUE pairs)
#
# The three flags below are required to run NVFP4 MoE models on the DGX Spark (SM121/GB10):
#
#   VLLM_NVFP4_GEMM_BACKEND=marlin
#     Routes dense NVFP4 linear layers to the Marlin dequant kernel. SM121 has
#     only 99 KiB shared memory vs B200's 228 KiB, so the default CUTLASS FP4
#     GEMM tiles would silently fall back to slower paths without this.
#
#   VLLM_USE_FLASHINFER_MOE_FP4=0
#     Removes FlashInfer MoE backends (FLASHINFER_TRTLLM, FLASHINFER_CUTLASS,
#     FLASHINFER_CUTEDSL) from consideration. FlashInfer 0.6.3 includes Blackwell
#     SM120 TMA grouped GEMM kernels that use the `cvt.e2m1x2` PTX instruction,
#     which is not supported on SM121. Attempting to JIT-compile these kernels
#     crashes vLLM at startup.
#
#   VLLM_TEST_FORCE_FP8_MARLIN=1
#     Forces Marlin as the MoE backend (despite the "FP8" name, this applies to
#     NVFP4 MoE layers too). Takes effect after VLLM_USE_FLASHINFER_MOE_FP4=0
#     removes FlashInfer, ensuring Marlin is selected rather than VLLM_CUTLASS.
#
#   VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
#     Bypasses vLLM's safety check that rejects max_model_len > the model's
#     native max_position_embeddings. Required when YaRN rope_scaling is
#     configured via --hf-overrides (vLLM's check runs before the override
#     merges). Remove when running at native context.
EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1 VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"

# ── Alternative model configs (uncomment to switch) ───────────────────────────
#
# Cirrascale/Qwen3-Coder-Next-NVFP4 (~40 GB, modelopt_fp4, hybrid GatedDeltaNet+MoE):
#   Was the active model prior to 2026-05-02. Switched away because prefix caching
#   is non-functional (0% hit rate) for hybrid Mamba architectures in avarok v23.
#   Revival requires BOTH (a) avarok v24+ image (vLLM main has all four Mamba APC
#   fixes merged as of 2026-03-10) AND (b) the cch_stripper LiteLLM hook (already
#   active in this project). Either alone is insufficient — see
#   prompt-processing-tuning.md "Test 3" for the cch finding.
#   MODEL_REPO="Cirrascale/Qwen3-Coder-Next-NVFP4"
#   MODEL_DIR_NAME="Qwen3-Coder-Next-NVFP4"
#   SERVED_MODEL_NAME="Cirrascale/Qwen3-Coder-Next-NVFP4"
#   QUANTIZATION="modelopt_fp4"
#   MAX_MODEL_LEN=262144
#   TOOL_CALL_PARSER="qwen3_coder"
#   MAX_TOKENS=16384
#   EXTRA_VLLM_FLAGS=""
#   EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1"
#
# RedHatAI/Qwen3-32B-NVFP4 (~18 GB, compressed-tensors, dense — no MoE flags needed):
#   MODEL_REPO="RedHatAI/Qwen3-32B-NVFP4"
#   MODEL_DIR_NAME="Qwen3-32B-NVFP4"
#   SERVED_MODEL_NAME="RedHatAI/Qwen3-32B-NVFP4"
