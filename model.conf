# ── Context-length tuning (alternatives to the default 512K) ──────────────────
#
# Rollback to native 256K — drop YaRN entirely, regain ~5× max-context concurrency.
# Restore these three fields together:
#   MAX_MODEL_LEN=262144
#   EXTRA_VLLM_FLAGS=""
#   EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1"
#   (drop VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 — no longer needed)
#
# 1M context with YaRN ×4 — at the documented model ceiling. ~50 GB KV per
# sequence at full 1M leaves little headroom for concurrent requests; YaRN×4
# also has more potential to degrade short-prompt quality than YaRN×2. Probably
# overkill for Claude Code workloads.
#   MAX_MODEL_LEN=1048576
#   EXTRA_VLLM_FLAGS='--hf-overrides {"max_position_embeddings":1048576,"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}'
