# model.conf — edit this file to switch models
# Sourced by start.sh, download-model.sh, use-local.sh, and cluster scripts.

# HuggingFace repo to download
MODEL_REPO="Cirrascale/Qwen3-Coder-Next-NVFP4"

# Local subdirectory under models/
MODEL_DIR_NAME="Qwen3-Coder-Next-NVFP4"

# Name vLLM advertises on /v1/models — must match litellm-config.yaml
SERVED_MODEL_NAME="Cirrascale/Qwen3-Coder-Next-NVFP4"

# vLLM quantization format (compressed-tensors, modelopt_fp4, awq, fp8, etc.)
QUANTIZATION="modelopt_fp4"

# Model's max context window in tokens
MAX_MODEL_LEN=262144

# Tool call parser (qwen3_xml, qwen3_coder, hermes, etc.)
TOOL_CALL_PARSER="qwen3_coder"

# Max tokens LiteLLM will return per response (caps individual replies, not context)
MAX_TOKENS=16384

# Optional extra vLLM CLI args appended to VLLM_EXTRA_ARGS — leave empty if not needed
EXTRA_VLLM_FLAGS=""

# Optional extra Docker -e env vars passed to the container (space-separated KEY=VALUE pairs)
#
# The three flags below are required to run NVFP4 MoE models on the DGX Spark (SM121/GB10):
#
#   VLLM_NVFP4_GEMM_BACKEND=marlin
#     Routes dense NVFP4 linear layers to the Marlin dequant kernel. SM121 has
#     only 99 KiB shared memory vs B200's 228 KiB, so the default CUTLASS FP4
#     GEMM tiles would silently fall back to slower paths without this.
#
#   VLLM_USE_FLASHINFER_MOE_FP4=0
#     Removes FlashInfer MoE backends (FLASHINFER_TRTLLM, FLASHINFER_CUTLASS,
#     FLASHINFER_CUTEDSL) from consideration. FlashInfer 0.6.3 includes Blackwell
#     SM120 TMA grouped GEMM kernels that use the `cvt.e2m1x2` PTX instruction,
#     which is not supported on SM121. Attempting to JIT-compile these kernels
#     crashes vLLM at startup.
#
#   VLLM_TEST_FORCE_FP8_MARLIN=1
#     Forces Marlin as the MoE backend (despite the "FP8" name, this applies to
#     NVFP4 MoE layers too). Takes effect after VLLM_USE_FLASHINFER_MOE_FP4=0
#     removes FlashInfer, ensuring Marlin is selected rather than VLLM_CUTLASS.
EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1"

# ── Alternative model configs (uncomment to switch) ───────────────────────────
#
# RedHatAI/Qwen3-32B-NVFP4 (~18 GB, compressed-tensors, dense — no MoE flags needed):
#   MODEL_REPO="RedHatAI/Qwen3-32B-NVFP4"
#   MODEL_DIR_NAME="Qwen3-32B-NVFP4"
#   SERVED_MODEL_NAME="RedHatAI/Qwen3-32B-NVFP4"
#   QUANTIZATION="compressed-tensors"
#   MAX_MODEL_LEN=40960
#   TOOL_CALL_PARSER="qwen3_xml"
#   MAX_TOKENS=16384
#   EXTRA_VLLM_FLAGS=""
#   EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin"
