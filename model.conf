# model.conf — edit this file to switch models or context lengths
# Sourced by start.sh, download-model.sh, use-local.sh, and cluster scripts.

# ── Container & launch convention ─────────────────────────────────────────────
#
# As of 2026-06 the official NVIDIA NGC vLLM container supports NVFP4 inference on
# the DGX Spark's GB10 GPU (SM121) — the CUTLASS FP4 GEMM crash that originally
# forced the avarok image is fixed upstream, and Marlin (still the fastest FP4-MoE
# path on GB10) is selected with the --moe-backend marlin CLI flag. This project
# now defaults to NGC. The avarok image remains available as a fallback.
# See prompt-processing-tuning.md "Test 5" for the migration findings.
#
# VLLM_IMAGE        — container image to run.
# VLLM_LAUNCH_STYLE — how start.sh invokes it ("ngc" | "avarok"):
#     ngc    — official nvcr.io/nvidia/vllm:*-py3 image. Pass-through entrypoint:
#              start.sh issues a full `vllm serve /model --flags…` command and
#              selects Marlin via --moe-backend marlin (so the avarok env trio in
#              EXTRA_DOCKER_ENVS below is NOT used).
#     avarok — avarok/dgx-vllm-nvfp4-kernel image. Env-var `serve` entrypoint:
#              start.sh passes MODEL/PORT/VLLM_EXTRA_ARGS env vars and the three
#              VLLM_*_MARLIN/FLASHINFER flags in EXTRA_DOCKER_ENVS.
#
# NGC image options (same launch style; switching tags invalidates the torch
# compile cache, so the first start on a new tag recompiles kernels — slow once):
#     nvcr.io/nvidia/vllm:26.04-py3   — vLLM 0.19.0. Default. The version with
#         community-documented SM121/GB10 NVFP4 success ("de-facto stable Spark NGC").
#     nvcr.io/nvidia/vllm:26.05-py3   — vLLM 0.20.1. One release newer; no
#         Spark-specific confirmation found yet. Try after 26.04 is validated.
#
# To fall back to avarok, set BOTH:
#     VLLM_IMAGE="avarok/dgx-vllm-nvfp4-kernel:v23"
#     VLLM_LAUNCH_STYLE="avarok"
VLLM_IMAGE="nvcr.io/nvidia/vllm:26.04-py3"
# VLLM_IMAGE="nvcr.io/nvidia/vllm:26.05-py3"   # newer (vLLM 0.20.1) — A/B vs 26.04
#   ^ 26.05 REGRESSION (2026-06-25): short prompts are coherent, but real
#     Claude Code workloads (large system prompt + tools + prefix cache + YaRN
#     512K) produce gibberish output. Stay on 26.04 until a newer NGC tag fixes
#     it. See prompt-processing-tuning.md "Test 5".
VLLM_LAUNCH_STYLE="ngc"

# LiteLLM proxy listen port (the Anthropic-API endpoint Claude Code points at via
# use-local.sh). Default is 4000; this host runs another local proxy on 4000
# (the lmstudio-claude-code app), so this project uses 4001 to coexist. Sourced by
# start.sh and use-local.sh so they always agree.
LITELLM_PORT=4001

# ── Model ─────────────────────────────────────────────────────────────────────
#
# HuggingFace repo to download
MODEL_REPO="NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"

# Local subdirectory under models/
MODEL_DIR_NAME="Qwen3-Coder-30B-A3B-Instruct-FP4"

# Name vLLM advertises on /v1/models — must match litellm-config.yaml
SERVED_MODEL_NAME="NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"

# vLLM quantization format (compressed-tensors, modelopt_fp4, awq, fp8, etc.)
# NOTE (NGC migration, verify): avarok v23 (vLLM 0.16) expects "modelopt_fp4" for
# these NVFP4 modelopt checkpoints. On the NGC image (vLLM 0.19) some community
# playbooks use "--quantization modelopt" instead. If the NGC container rejects
# "modelopt_fp4" at startup, check `docker run --rm <image> vllm serve --help`
# and switch this to "modelopt".
QUANTIZATION="modelopt_fp4"

# Tool call parser (qwen3_xml, qwen3_coder, gemma4, hermes, etc.)
TOOL_CALL_PARSER="qwen3_coder"

# Per-model extra vLLM CLI args (separate from EXTRA_VLLM_FLAGS, which is
# context-profile-scoped). Set to empty for models without special requirements.
# (Gemma 4 would need --reasoning-parser gemma4 --trust-remote-code, but it
# also needs a different vLLM image — see the Gemma alternative-config block.)
MODEL_EXTRA_FLAGS=""

# Max tokens LiteLLM will return per response (caps individual replies, not context)
MAX_TOKENS=16384

# ── Context profile — exactly ONE block must be uncommented ───────────────────
#
# Each block sets three variables together:
#   MAX_MODEL_LEN     — context window vLLM serves
#   EXTRA_VLLM_FLAGS  — extra CLI args for vllm serve (rope-scaling overrides)
#   _YARN_DOCKER_ENV  — extra Docker env (the YaRN bypass flag, or empty)
#
# How to switch profiles:
#   1. Find the currently-uncommented 3-line block below (the one without `#`
#      prefixes on the three assignment lines). Add `#` to the start of each
#      of those three lines to comment it out.
#   2. Find the block you want to switch to. Remove the `#` from the start of
#      its three assignment lines (leave the descriptive comment lines alone).
#   3. From the project directory, restart the server so the new profile
#      takes effect (the --clean flag removes the container — required when
#      MAX_MODEL_LEN changes since vLLM's compiled CUDA graphs are
#      shape-specific):
#         ./stop.sh --clean && ./start.sh
#
# Worked example — switching from the active 512K profile back to 256K native:
#   Before (current default):            After:
#     # MAX_MODEL_LEN=262144               MAX_MODEL_LEN=262144
#     # EXTRA_VLLM_FLAGS=""                EXTRA_VLLM_FLAGS=""
#     # _YARN_DOCKER_ENV=""                _YARN_DOCKER_ENV=""
#     ...                                  ...
#     MAX_MODEL_LEN=524288                 # MAX_MODEL_LEN=524288
#     EXTRA_VLLM_FLAGS='--hf-...'          # EXTRA_VLLM_FLAGS='--hf-...'
#     _YARN_DOCKER_ENV="VLLM_..."          # _YARN_DOCKER_ENV="VLLM_..."
#
# Bash uses last-assignment-wins, so accidentally leaving two blocks
# uncommented just picks the lower one — but please keep it clean.

# --- 256K native --------------------------------------------------------------
# Best for short interactive sessions where conversations stay well under
# 200K. Auto-compaction (in the upstream agentic client) kicks in around
# 230K — older history gets summarized into a single message and detail
# is lost.
# MAX_MODEL_LEN=262144
# EXTRA_VLLM_FLAGS=""
# _YARN_DOCKER_ENV=""

# --- 512K via YaRN ×2 (active) ------------------------------------------------
# Default for long agentic sessions where dense history (file reads + tool
# flows) would otherwise hit the 230K compaction threshold. Pushes compaction
# to ~480K — roughly 2× more turns of verbatim history before any of it gets
# summarized. Measured 2026-05-02 with Qwen3-Coder-30B-A3B: gen throughput
# essentially identical to native 256K at matched prompt sizes (initial
# "~13% YaRN cost" reading was sample-size noise). Caching/TTFT unaffected.
# YaRN factor=2.0 should be near-identical to native RoPE in the interpolated
# range; no formal short-prompt quality A/B yet. Note: Gemma 4 has hybrid
# sliding-window + global attention; YaRN behavior past native may differ
# from pure-attention models — verify quality if pushing prompts past 256K.
MAX_MODEL_LEN=524288
EXTRA_VLLM_FLAGS='--hf-overrides {"max_position_embeddings":524288,"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":262144}}'
_YARN_DOCKER_ENV="VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"

# --- 1M via YaRN ×4 -----------------------------------------------------------
# Documented model ceiling. ~50 GB KV per max-context sequence leaves little
# headroom for concurrency. YaRN×4 has more potential to degrade short-prompt
# quality than YaRN×2. Probably overkill for typical workloads.
# MAX_MODEL_LEN=1048576
# EXTRA_VLLM_FLAGS='--hf-overrides {"max_position_embeddings":1048576,"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}'
# _YARN_DOCKER_ENV="VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"

# ── SM121 NVFP4 MoE Docker env flags ──────────────────────────────────────────
#
# How Marlin (the required FP4-MoE backend on GB10) gets selected differs by
# VLLM_LAUNCH_STYLE:
#
#   ngc    — selected by the `--moe-backend marlin` CLI flag that start.sh adds to
#            the `vllm serve` command. The avarok env trio below is NOT needed and
#            is left out of EXTRA_DOCKER_ENVS; only the YaRN bypass (and, if a test
#            shows it's required on a given image, CUTE_DSL_ARCH=sm_121a) is passed.
#
#   avarok — selected by three env vars (the official container couldn't do FP4 on
#            SM121 when this image was built, so avarok routed everything to Marlin
#            via env):
#     VLLM_NVFP4_GEMM_BACKEND=marlin — routes dense NVFP4 linear layers to the
#       Marlin dequant kernel. SM121 has only 99 KiB shared memory vs B200's
#       228 KiB, so the default CUTLASS FP4 GEMM tiles silently fall back without it.
#     VLLM_USE_FLASHINFER_MOE_FP4=0 — removes FlashInfer MoE backends. FlashInfer
#       0.6.3 ships Blackwell SM120 TMA grouped GEMM kernels using the `cvt.e2m1x2`
#       PTX instruction, unsupported on SM121; JIT-compiling them crashes vLLM.
#     VLLM_TEST_FORCE_FP8_MARLIN=1 — forces Marlin as the MoE backend (despite the
#       "FP8" name this applies to NVFP4 MoE too).
#
# The `${_YARN_DOCKER_ENV:+ ...}` suffix appends the YaRN bypass flag
# (VLLM_ALLOW_LONG_MAX_MODEL_LEN=1) only when a YaRN profile is active; it's
# omitted at native 256K. vLLM's max_model_len validation runs before
# --hf-overrides merges and would otherwise reject the YaRN-extended length.
case "$VLLM_LAUNCH_STYLE" in
  ngc)
    # Marlin comes from --moe-backend marlin in start.sh; no avarok env trio here.
    # If a future NGC image needs it, append: CUTE_DSL_ARCH=sm_121a
    EXTRA_DOCKER_ENVS="${_YARN_DOCKER_ENV:-}"
    ;;
  *)  # avarok
    EXTRA_DOCKER_ENVS="VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1${_YARN_DOCKER_ENV:+ $_YARN_DOCKER_ENV}"
    ;;
esac

# ── Alternative model configs (uncomment to switch model) ─────────────────────
#
# nvidia/Gemma-4-26B-A4B-NVFP4 (~14 GB, modelopt, gemma4 hybrid attention MoE):
#   Attempted A/B test 2026-05-03; ABANDONED before benchmark. Requires a
#   different vLLM container (vllm/vllm-openai:gemma4-cu130) since avarok v23
#   (vLLM 0.16) predates Gemma 4 support and rejects --tool-call-parser gemma4
#   as unrecognized. The blog setup (ai-muninn.com Gemma 4 26B benchmark) also
#   requires a patched gemma4_patched.py mounted into the container to fix
#   scale key mapping on SM121. Switching containers is a real refactor (the
#   two images have completely different launch conventions). Revisit when
#   either avarok ships v24+ with vLLM ≥ 0.19, or we invest in the
#   per-image-launch refactor and locate the patched python file.
#   Reported solo gen throughput on DGX Spark: 52 t/s (vs ~30 t/s on Qwen3).
#   Tool-call parser used: --tool-call-parser pythonic (NOT gemma4).
#   MODEL_REPO="nvidia/Gemma-4-26B-A4B-NVFP4"
#   MODEL_DIR_NAME="Gemma-4-26B-A4B-NVFP4"
#   SERVED_MODEL_NAME="nvidia/Gemma-4-26B-A4B-NVFP4"
#   QUANTIZATION="modelopt"
#   TOOL_CALL_PARSER="pythonic"
#   MODEL_EXTRA_FLAGS="--reasoning-parser gemma4 --trust-remote-code --moe-backend marlin"
#   (VLLM_IMAGE/VLLM_LAUNCH_STYLE are now configurable at the top of this file, so
#    pointing at vllm/vllm-openai:gemma4-cu130 with VLLM_LAUNCH_STYLE="ngc" is now
#    possible — still needs the gemma4_patched.py scale-key fix mounted in, and
#    quality/throughput unverified.)
#
# Cirrascale/Qwen3-Coder-Next-NVFP4 (~40 GB, modelopt_fp4, hybrid GatedDeltaNet+MoE):
#   Was the active model prior to 2026-05-02. Switched away because prefix caching
#   is non-functional (0% hit rate) for hybrid Mamba architectures in avarok v23.
#   Revival requires BOTH (a) a vLLM build with the four Mamba APC fixes AND
#   (b) the cch_stripper LiteLLM hook (already active). Update 2026-06-25: those
#   fixes are now in the official NGC image (vLLM 0.19/0.20), so the (a) blocker is
#   met by VLLM_IMAGE="nvcr.io/nvidia/vllm:26.04-py3" + VLLM_LAUNCH_STYLE="ngc" —
#   no longer waiting on a hypothetical avarok v24. Revival is untested/deferred;
#   see prompt-processing-tuning.md "Test 3" (cch) and "Test 5" (NGC migration).
#   MODEL_REPO="Cirrascale/Qwen3-Coder-Next-NVFP4"
#   MODEL_DIR_NAME="Qwen3-Coder-Next-NVFP4"
#   SERVED_MODEL_NAME="Cirrascale/Qwen3-Coder-Next-NVFP4"
#   QUANTIZATION="modelopt_fp4"
#   TOOL_CALL_PARSER="qwen3_coder"
#
# RedHatAI/Qwen3-32B-NVFP4 (~18 GB, compressed-tensors, dense — no MoE flags needed):
#   MODEL_REPO="RedHatAI/Qwen3-32B-NVFP4"
#   MODEL_DIR_NAME="Qwen3-32B-NVFP4"
#   SERVED_MODEL_NAME="RedHatAI/Qwen3-32B-NVFP4"
#   QUANTIZATION="compressed-tensors"
#   TOOL_CALL_PARSER="qwen3_xml"
#   (also: native context for this model is 40K, so use the 256K-or-less profile;
#    and you can drop VLLM_USE_FLASHINFER_MOE_FP4 / VLLM_TEST_FORCE_FP8_MARLIN
#    from EXTRA_DOCKER_ENVS since this model has no MoE layers)
